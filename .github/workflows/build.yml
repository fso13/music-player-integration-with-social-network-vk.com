name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MusicPlayer/MusicPlayer.sln -c Release --nologo

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-${{ matrix.os }}
          path: MusicPlayer/Avalonia/bin/Release/
          if-no-files-found: error
